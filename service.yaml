apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: iluo-skill-portal
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 120
      containers:
        - image: IMAGE_URI_PLACEHOLDER
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: UV_THREADPOOL_SIZE
              value: "2"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: iluo-session-secret
                  key: latest
            - name: UPSTASH_REDIS_REST_URL
              valueFrom:
                secretKeyRef:
                  name: iluo-redis-url
                  key: latest
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iluo-redis-token
                  key: latest
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
